<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow — Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <span>Task<em>Flow</em></span>
        </div>
        <nav>
          <div class="nav-item active">
            <i class="ti ti-layout-dashboard"></i>
            All Tasks
          </div>
          <a href="form.html" class="nav-item">
            <i class="ti ti-plus"></i>
            New Task
          </a>
        </nav>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="page-header">
          <div>
            <h1 class="page-title">Task Board</h1>
            <p class="page-subtitle">Manage and track your team's work</p>
          </div>
          <a href="form.html" class="btn btn-primary">
            <i class="ti ti-plus"></i>
            New Task
          </a>
        </div>

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-value accent" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">To Do</div>
            <div class="stat-value" id="stat-todo">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">In Progress</div>
            <div class="stat-value amber" id="stat-in-progress">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Done</div>
            <div class="stat-value green" id="stat-done">—</div>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="search-wrap">
            <i class="ti ti-search"></i>
            <input
              id="search-input"
              type="text"
              placeholder="Search tasks by title or description…"
            />
          </div>

          <select id="status-filter" class="filter-select">
            <option value="">All Statuses</option>
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="done">Done</option>
          </select>

          <select id="priority-filter" class="filter-select">
            <option value="">All Priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>

          <input
            id="tags-filter"
            type="text"
            class="filter-select"
            placeholder="Filter by tag…"
            style="min-width: 130px; padding: 9px 14px"
          />
        </div>

        <!-- Table -->
        <div class="task-table-wrap">
          <div id="table-wrap">
            <!-- Rendered by app.js -->
          </div>
          <div id="pagination" class="pagination"></div>
        </div>
      </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-backdrop" id="delete-modal">
      <div class="modal">
        <p class="modal-title">Delete Task?</p>
        <p class="modal-body">
          You are about to permanently delete
          <strong id="delete-task-name"></strong>. This action cannot be undone.
        </p>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeDeleteModal()">
            Cancel
          </button>
          <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div class="toast-wrap" id="toast-wrap"></div>

    <script src="api.js"></script>
    <script src="app.js"></script>
  </body>
</html>
